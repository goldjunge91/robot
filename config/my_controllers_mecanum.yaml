controller_manager:
  ros__parameters:
    update_rate: 30

    # Controller Definitions
    # This is where you list the controllers and their types.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
      # The parameters for this controller are now nested directly below.
      ros__parameters:
        publish_rate: 50.0
        
        # Joint names from your URDF
        front_left_wheel_name: "front_left_wheel_joint"
        front_right_wheel_name: "front_right_wheel_joint"
        rear_left_wheel_name: "rear_left_wheel_joint"
        rear_right_wheel_name: "rear_right_wheel_joint"

        # Physical parameters of your robot
        wheel_separation_x: 0.2
        wheel_separation_y: 0.34
        wheel_radius: 0.05

        # Other settings
        odom_frame_id: odom
        base_frame_id: base_link
        open_loop: true
        enable_odom_tf: true
        cmd_vel_timeout: 0.5