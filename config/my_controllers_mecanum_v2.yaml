controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_drive_controller:
  ros__parameters:
    
        # NEU: Wir legen das Kommando-Topic explizit fest.
    command_topic: "/cmd_vel"

    front_left_wheel_name: "front_left_wheel_joint"
    front_right_wheel_name: "front_right_wheel_joint"
    rear_left_wheel_name: "rear_left_wheel_joint"
    rear_right_wheel_name: "rear_right_wheel_joint"

    # Die exakten Parameternamen, die der Controller laut Fehlermeldung erwartet:
    front_left_wheel_command_joint_name:  "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name:   "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name:  "rear_right_wheel_joint"
    
    wheel_base: 0.24 
    track_width: 0.297
    wheel_radius: 0.033

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true

    use_stamped_vel: false